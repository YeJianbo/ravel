name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release to receive the completed build
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "script/**"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "script/**"
      - ".github/workflows/release.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:

  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || github.event.release.assets[0] == null)
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout Ravel core
        uses: actions/checkout@v5
        with:
          repository: YeJianbo/ravel-go
          ref: 24138bf0c639b5fb21d7cf8268ece2d41bfdc3df
          path: .ravel-core
          ssh-key: ${{ secrets.RAVEL_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: |
          go mod edit -replace=github.com/YeJianbo/ravel-go=./.ravel-core
          go mod download
      - name: Test Ravel runtime
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GODEBUG: http2xconnect=1
        run: go test ./api/v2board ./limiter ./core ./node
      - name: Get release version
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=$RELEASE_TAG" >> $GITHUB_ENV
      - name: Get other version
        if: github.event_name != 'release' && inputs.release_tag == ''
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_ENV
      - name: Build ravel
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/ravel -trimpath -ldflags "-X 'github.com/YeJianbo/ravel/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat ravel
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/ravel_softfloat -trimpath -ldflags "-X 'github.com/YeJianbo/ravel/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows ravel
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv ravel ravel.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/NOTICE ./build_assets/NOTICE
          cp ${GITHUB_WORKSPACE}/script/ravel-install.sh ./build_assets/install.sh
          cp ${GITHUB_WORKSPACE}/script/ravel.sh ./build_assets/ravel.sh
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../ravel-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./ravel-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets ravel-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ravel-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./ravel-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        if: github.event_name == 'release' || inputs.release_tag != ''
        with:
          name: release-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: ./ravel-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          if-no-files-found: error

  upload:
    needs: build
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
      - name: Upload completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REQUIRE_DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$REQUIRE_DRAFT" == true ]]; then
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || exit 1
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.dgst --clobber
